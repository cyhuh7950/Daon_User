{
  "name": "Release 1 iOS Phase A",
  "on": {"pull_request": {"branches": ["codex/release-1"]}, "workflow_dispatch": {}},
  "permissions": {"contents": "read"},
  "jobs": {
    "ios-phase-a": {
      "name": "iOS Phase A Simulator",
      "runs-on": "macos-26",
      "timeout-minutes": 60,
      "steps": [
        {"name": "Checkout immutable candidate", "id": "checkout", "uses": "actions/checkout@v5", "with": {"fetch-depth": 0}},
        {"name": "Use approved Node", "id": "setup-node", "uses": "actions/setup-node@v5", "with": {"node-version": "24.18.0", "cache": "npm"}},
        {"name": "Select exact Xcode", "id": "xcode", "shell": "bash", "run": "set -euo pipefail\ntest \"$(cat .xcode-version)\" = \"26.6\"\ntest -d /Applications/Xcode_26.6.app\necho \"DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer\" >> \"$GITHUB_ENV\"\nDEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer xcodebuild -version | tee artifacts-xcode-version.txt"},
        {"name": "Load approved uv pin", "id": "toolchain-pins", "shell": "bash", "run": "set -euo pipefail\nnode -e 'const fs=require(\"node:fs\");const uv=require(\"./toolchain-versions.json\").toolchains.uv;fs.appendFileSync(process.env.GITHUB_OUTPUT,`uv=${uv}\\n`);'"},
        {"name": "Install approved uv", "id": "setup-uv", "uses": "astral-sh/setup-uv@v7", "with": {"version": "${{ steps.toolchain-pins.outputs.uv }}"}},
        {"name": "Verify exact Node, npm and uv", "id": "node-npm", "shell": "bash", "run": "set -euo pipefail\ntest \"$(node --version)\" = \"v24.18.0\"\nnpm install --global npm@11.12.1\ntest \"$(npm --version)\" = \"11.12.1\"\nUV_PIN=\"$(node -p 'require(\"./toolchain-versions.json\").toolchains.uv')\"\ntest \"${UV_PIN}\" = \"0.11.2\"\nUV_VERSION=\"$(uv --version | awk '{print $2}')\"\ntest \"${UV_VERSION}\" = \"${UV_PIN}\"\nnpm run verify:toolchain"},
        {"name": "Install exact CocoaPods", "id": "cocoapods", "shell": "bash", "run": "set -euo pipefail\ntest \"$(cat .cocoapods-version)\" = \"1.16.2\"\nPOD_GEM_HOME=\"${RUNNER_TEMP}/daon-cocoapods-1.16.2/gems\"\nPOD_GEM_BIN=\"${RUNNER_TEMP}/daon-cocoapods-1.16.2/bin\"\nDEFAULT_GEM_PATH=\"$(gem env path)\"\nmkdir -p \"${POD_GEM_HOME}\" \"${POD_GEM_BIN}\"\nexport GEM_HOME=\"${POD_GEM_HOME}\"\nexport GEM_PATH=\"${POD_GEM_HOME}:${DEFAULT_GEM_PATH}\"\nprintf 'GEM_HOME=%s\\nGEM_PATH=%s\\n' \"${GEM_HOME}\" \"${GEM_PATH}\" >> \"${GITHUB_ENV}\"\ngem install cocoapods -v 1.16.2 --no-document --install-dir \"${POD_GEM_HOME}\" --bindir \"${POD_GEM_BIN}\"\nDAON_POD_VERSION=\"$(gem exec -g cocoapods -v 1.16.2 pod --version)\"\nprintf 'CocoaPods version: %s\\n' \"${DAON_POD_VERSION}\"\ntest \"${DAON_POD_VERSION}\" = \"1.16.2\"\nruby --version\nbundle --version"},
        {"name": "Install approved npm lockfile", "id": "npm-ci", "run": "npm ci --ignore-scripts"},
        {"name": "Run Windows-portable iOS contracts and mobile regression", "id": "portable-contracts", "run": "npm run verify:ios-native && npm run verify:mobile"},
        {"name": "Install reproducible Pods", "id": "pods", "shell": "bash", "run": "set -euo pipefail\ntest \"$(gem exec -g cocoapods -v 1.16.2 pod --version)\" = \"1.16.2\"\ngem exec -g cocoapods -v 1.16.2 pod install --project-directory=apps/mobile/ios\nshasum -a 256 apps/mobile/ios/Podfile.lock | tee artifacts-podfile-lock-before.txt\ngem exec -g cocoapods -v 1.16.2 pod install --deployment --project-directory=apps/mobile/ios\nshasum -a 256 apps/mobile/ios/Podfile.lock | tee artifacts-podfile-lock-after.txt\ndiff artifacts-podfile-lock-before.txt artifacts-podfile-lock-after.txt"},
        {"name": "Create exact simulator", "id": "simulator", "run": "node apps/mobile/ios/ci/prepare-simulator.mjs"},
        {"name": "Build unsigned Simulator app", "id": "build", "env": {"SIMULATOR_UDID": "${{ steps.simulator.outputs.udid }}"}, "run": "bash apps/mobile/ios/ci/build-simulator.sh"},
        {"name": "Run iOS UI route, lifecycle and Settings tests", "id": "ui-tests", "env": {"SIMULATOR_UDID": "${{ steps.simulator.outputs.udid }}"}, "shell": "bash", "run": "set -euo pipefail\nmkdir -p artifacts/ios-phase-a/evidence\nxcodebuild test -workspace apps/mobile/ios/Daon.xcworkspace -scheme Daon -configuration Release -sdk iphonesimulator -destination \"platform=iOS Simulator,id=${SIMULATOR_UDID}\" -derivedDataPath artifacts/ios-phase-a/DerivedData -only-testing:DaonUITests/DaonUITests/testApprovedNavigationRoutesAreClickable -only-testing:DaonUITests/DaonUITests/testForegroundBackgroundAndRelaunchPreserveApprovedRoute -only-testing:DaonUITests/DaonUITests/testPermissionControlsAndSettingsBoundary -resultBundlePath artifacts/ios-phase-a/evidence/DaonUITests.xcresult CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO"},
        {"name": "Verify Simulator install, deep links, permissions and lifecycle", "id": "simulator-verification", "env": {"SIMULATOR_UDID": "${{ steps.simulator.outputs.udid }}"}, "run": "bash apps/mobile/ios/ci/verify-simulator.sh"},
        {"name": "Write fail-close workflow outcomes", "id": "outcomes", "if": "${{ always() }}", "env": {"IOS_STEP_CHECKOUT": "${{ steps.checkout.outcome }}", "IOS_STEP_SETUP_NODE": "${{ steps.setup-node.outcome }}", "IOS_STEP_XCODE": "${{ steps.xcode.outcome }}", "IOS_STEP_SETUP_UV": "${{ steps.setup-uv.outcome }}", "IOS_STEP_NODE_NPM": "${{ steps.node-npm.outcome }}", "IOS_STEP_COCOAPODS": "${{ steps.cocoapods.outcome }}", "IOS_STEP_NPM_CI": "${{ steps.npm-ci.outcome }}", "IOS_STEP_PORTABLE_CONTRACTS": "${{ steps.portable-contracts.outcome }}", "IOS_STEP_PODS": "${{ steps.pods.outcome }}", "IOS_STEP_SIMULATOR": "${{ steps.simulator.outcome }}", "IOS_STEP_BUILD": "${{ steps.build.outcome }}", "IOS_STEP_UI_TESTS": "${{ steps.ui-tests.outcome }}", "IOS_STEP_SIMULATOR_VERIFICATION": "${{ steps.simulator-verification.outcome }}"}, "shell": "bash", "run": "mkdir -p artifacts/ios-phase-a/evidence\nnode -e 'const fs=require(\"node:fs\");const names={checkout:\"IOS_STEP_CHECKOUT\",setup_node:\"IOS_STEP_SETUP_NODE\",xcode:\"IOS_STEP_XCODE\",setup_uv:\"IOS_STEP_SETUP_UV\",node_npm:\"IOS_STEP_NODE_NPM\",cocoapods:\"IOS_STEP_COCOAPODS\",npm_ci:\"IOS_STEP_NPM_CI\",portable_contracts:\"IOS_STEP_PORTABLE_CONTRACTS\",pods:\"IOS_STEP_PODS\",simulator:\"IOS_STEP_SIMULATOR\",build:\"IOS_STEP_BUILD\",ui_tests:\"IOS_STEP_UI_TESTS\",simulator_verification:\"IOS_STEP_SIMULATOR_VERIFICATION\"};const steps=Object.fromEntries(Object.entries(names).map(([key,env])=>[key,process.env[env]??\"missing\"]));fs.writeFileSync(\"artifacts/ios-phase-a/evidence/workflow-outcomes.json\",JSON.stringify({git_sha:process.env.GITHUB_SHA,steps},null,2)+\"\\n\");'"},
        {"name": "Write exact-SHA evidence manifest", "id": "manifest", "if": "${{ always() }}", "env": {"SIMULATOR_UDID": "${{ steps.simulator.outputs.udid }}", "IOS_SIMULATOR_RUNTIME": "${{ steps.simulator.outputs.runtime }}", "IOS_SIMULATOR_DEVICE": "${{ steps.simulator.outputs.device }}"}, "shell": "bash", "run": "set -u\nmkdir -p artifacts/ios-phase-a/evidence\necho \"RUNNER_NAME=${RUNNER_NAME:-unknown}\" > artifacts/ios-phase-a/evidence/runner.txt\necho \"ImageOS=${ImageOS:-unknown}\" >> artifacts/ios-phase-a/evidence/runner.txt\necho \"ImageVersion=${ImageVersion:-unknown}\" >> artifacts/ios-phase-a/evidence/runner.txt\nXCODE_LINES=\"$(xcodebuild -version 2>/dev/null || true)\"\nIOS_COCOAPODS_VERSION=\"$(gem exec -g cocoapods -v 1.16.2 pod --version 2>/dev/null || true)\"\nexport IOS_UV_VERSION=\"$(uv --version 2>/dev/null || true)\" IOS_NPM_VERSION=\"$(npm --version 2>/dev/null || true)\" IOS_XCODE_VERSION=\"$(printf '%s\\n' \"${XCODE_LINES}\" | head -1 | awk '{print $2}')\" IOS_XCODE_BUILD_VERSION=\"$(printf '%s\\n' \"${XCODE_LINES}\" | tail -1)\" IOS_SDK_VERSION=\"$(xcrun --sdk iphonesimulator --show-sdk-version 2>/dev/null || true)\" IOS_COCOAPODS_VERSION IOS_RUBY_VERSION=\"$(ruby --version 2>/dev/null || true)\" IOS_BUNDLER_VERSION=\"$(bundle --version 2>/dev/null || true)\"\nif [ -f apps/mobile/ios/ci/write-evidence.mjs ]; then node apps/mobile/ios/ci/write-evidence.mjs; else node -e 'const fs=require(\"node:fs\");const file=\"artifacts/ios-phase-a/evidence/workflow-outcomes.json\";let outcomes=null;try{outcomes=JSON.parse(fs.readFileSync(file,\"utf8\"))}catch{}const failed=Object.entries(outcomes?.steps??{}).filter(([,value])=>value===\"failure\").map(([key])=>key);fs.writeFileSync(\"artifacts/ios-phase-a/evidence/evidence-manifest.json\",JSON.stringify({schema_version:\"1.1\",status:failed.length?\"FAILED\":\"INCOMPLETE\",verification_completed:false,failed_steps:failed,incomplete_reasons:[\"checkout:repository_unavailable\"],workflow_outcomes:outcomes?.steps??{},git_sha:process.env.GITHUB_SHA??\"unknown\"},null,2)+\"\\n\");'; fi"},
        {"name": "Shutdown simulator", "if": "${{ always() }}", "env": {"SIMULATOR_UDID": "${{ steps.simulator.outputs.udid }}"}, "shell": "bash", "run": "if [ -n \"${SIMULATOR_UDID:-}\" ]; then xcrun simctl terminate \"$SIMULATOR_UDID\" com.sinsan.daon || true; xcrun simctl shutdown \"$SIMULATOR_UDID\" || true; xcrun simctl delete \"$SIMULATOR_UDID\" || true; fi"},
        {"name": "Upload exact-SHA Phase A evidence", "if": "${{ always() }}", "uses": "actions/upload-artifact@v6", "with": {"name": "release-1-ios-phase-a-${{ github.sha }}", "path": "artifacts/ios-phase-a\nartifacts-xcode-version.txt\nartifacts-podfile-lock-before.txt\nartifacts-podfile-lock-after.txt", "if-no-files-found": "error", "retention-days": 30}}
      ]
    }
  }
}
