[package]
name = "daon-user-desktop"
version = "0.1.0"
default-run = "daon-user-desktop"
description = "Daon 사용자 프로그램 Windows App"
authors = ["Daon"]
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "daon_user_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
contract-test = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
getrandom = "=0.4.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.4", features = [] }
time = { version = "=0.3.51", features = ["parsing"] }
tokio = { version = "=1.53.1", features = ["rt", "sync"] }
zeroize = "=1.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
